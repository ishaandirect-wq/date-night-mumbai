<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Date Night Mumbai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,440;0,9..144,560;1,9..144,440&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --ink:#1B1625;
    --dusk:#3A2A4D;
    --amber:#E8A33D;
    --paper:#F3ECE1;
    --rose:#B84B5E;
    --line: rgba(243,236,225,0.10);
    --muted: rgba(243,236,225,0.55);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter', sans-serif;
  }
  a{color:inherit; text-decoration:none;}

  /* ---------- NAV ---------- */
  nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 32px;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    background:rgba(27,22,37,0.92);
    backdrop-filter:blur(6px);
    z-index:50;
    flex-wrap:wrap;
    gap:12px;
  }
  .logo{
    font-family:'Fraunces', serif;
    font-weight:560;
    font-size:18px;
  }
  .logo span{color:var(--amber);}
  .view-toggle{
    display:flex;
    gap:6px;
    background:rgba(243,236,225,0.06);
    border:1px solid var(--line);
    border-radius:100px;
    padding:3px;
  }
  .view-toggle button{
    background:transparent;
    border:none;
    color:var(--paper);
    font-size:12.5px;
    font-weight:600;
    padding:7px 16px;
    border-radius:100px;
    cursor:pointer;
  }
  .view-toggle button.active{
    background:var(--amber);
    color:var(--ink);
  }

  /* ---------- FILTER BAR ---------- */
  .filters{
    padding:18px 32px;
    border-bottom:1px solid var(--line);
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
  }
  .search-box{
    flex:1;
    min-width:180px;
    background:rgba(243,236,225,0.06);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 14px;
    font-size:13.5px;
    color:var(--paper);
  }
  .search-box::placeholder{color:var(--muted);}
  select{
    background:rgba(243,236,225,0.06);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    font-size:13px;
    color:var(--paper);
  }
  .cat-pill{
    padding:8px 14px;
    border-radius:100px;
    border:1px solid var(--line);
    font-size:12.5px;
    font-weight:500;
    color:var(--paper);
    cursor:pointer;
    background:transparent;
    white-space:nowrap;
  }
  .cat-pill.active{
    background:var(--amber);
    color:var(--ink);
    border-color:var(--amber);
    font-weight:600;
  }
  .cat-row{
    padding:0 32px 16px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }

  /* ---------- GRID ---------- */
  #gridView{ padding: 24px 32px 70px; }
  .grid{
    columns:3 260px;
    column-gap:16px;
  }
  .tile{
    break-inside:avoid;
    margin-bottom:16px;
    position:relative;
    border-radius:6px;
    overflow:hidden;
    color:var(--paper);
    display:flex;
    align-items:flex-end;
    min-height:180px;
    border:1px solid var(--line);
    cursor:pointer;
    background-size:cover;
    background-position:center;
    background-color:#241E30;
  }
  .tile-overlay{
    position:relative;
    z-index:2;
    padding:14px 14px 13px;
    width:100%;
    background:linear-gradient(0deg, rgba(0,0,0,0.75), transparent 68%);
  }
  .cat-tag{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--amber);
    margin-bottom:4px;
    display:block;
    font-weight:600;
  }
  .tile-overlay h3{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:15.5px;
    line-height:1.25;
  }
  .tile-overlay .meta{
    font-size:10.5px;
    color:rgba(243,236,225,0.75);
    margin-top:3px;
  }
  .verified-dot{
    position:absolute;
    top:12px; right:12px; z-index:3;
    background:rgba(27,22,37,0.85);
    color:var(--amber);
    font-size:9.5px;
    font-weight:600;
    padding:4px 8px;
    border-radius:100px;
    border:1px solid rgba(232,163,61,0.3);
  }
  .empty-state{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
    font-size:14px;
  }

  /* ---------- MAP ---------- */
  #mapView{ display:none; height:calc(100vh - 130px); }
  #leafletMap{ height:100%; width:100%; }
  .leaflet-popup-content-wrapper{
    background:var(--paper);
    color:var(--ink);
    border-radius:10px;
  }
  .leaflet-popup-content{ font-family:'Inter', sans-serif; }
  .popup-cat{ font-size:10px; color:var(--rose); font-weight:700; text-transform:uppercase; }
  .popup-name{ font-family:'Fraunces', serif; font-size:15px; margin:2px 0 4px; }
  .popup-link{ font-size:12px; font-weight:600; color:var(--dusk); }

  /* Fake dark mode on free OpenStreetMap tiles — no API key needed */
  .leaflet-tile-pane{
    filter: invert(1) hue-rotate(180deg) brightness(0.92) contrast(0.88) saturate(0.7);
  }

  footer{
    text-align:center;
    padding:28px;
    font-size:12px;
    color:var(--muted);
    border-top:1px solid var(--line);
  }
  .loading{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
    font-size:13px;
  }
</style>
</head>
<body>

<nav>
  <div class="logo">Date Night <span>Mumbai</span></div>
  <div class="view-toggle">
    <button id="btnGrid" class="active">Grid</button>
    <button id="btnMap">Map</button>
  </div>
</nav>

<div class="filters">
  <input class="search-box" id="searchInput" placeholder="Search by name or neighbourhood...">
  <select id="neighbourhoodFilter"><option value="">All neighbourhoods</option></select>
  <select id="priceFilter">
    <option value="">Any price</option>
    <option value="CHECK - Price: Free">Free</option>
    <option value="CHECK - Price: Under Rs1,000">Under ₹1,000</option>
    <option value="CHECK - Price: Rs1,000-3,000">₹1,000–3,000</option>
    <option value="CHECK - Price: Rs3,000+">₹3,000+</option>
  </select>
</div>
<div class="cat-row" id="categoryRow">
  <button class="cat-pill active" data-cat="">All</button>
  <button class="cat-pill" data-cat="CHECK - Category: Restaurants & Cafes">Restaurants & Cafes</button>
  <button class="cat-pill" data-cat="CHECK - Category: Rooftops & Bars">Rooftops & Bars</button>
  <button class="cat-pill" data-cat="CHECK - Category: Culture & Museums">Culture & Museums</button>
  <button class="cat-pill" data-cat="CHECK - Category: Activities & Experiences">Activities & Experiences</button>
  <button class="cat-pill" data-cat="CHECK - Category: Outdoors & Free">Outdoors & Free</button>
</div>

<div id="gridView">
  <div class="grid" id="grid"><div class="loading">Loading spots…</div></div>
</div>

<div id="mapView">
  <div id="leafletMap"></div>
</div>

<footer>Date Night Mumbai — verified spots, curated by hand.</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* =========================================================
   CONFIG — fill these in before deploying
   ========================================================= */
const AIRTABLE_BASE_ID   = "appymgOj0fBs13ykQ";
const AIRTABLE_TABLE_NAME = "List of Locations";
const AIRTABLE_PAT        = "patADgJRmGUPrQECT.53aed39ac4e9a3ec87c7f4ee9502504922652b59b332e5b302332b4193e544bd"; // read-only, scoped to this base only
/* ========================================================= */

const CATEGORY_TAGS = {
  "CHECK - Category: Restaurants & Cafes": "Restaurants & Cafes",
  "CHECK - Category: Rooftops & Bars": "Rooftops & Bars",
  "CHECK - Category: Culture & Museums": "Culture & Museums",
  "CHECK - Category: Activities & Experiences": "Activities & Experiences",
  "CHECK - Category: Outdoors & Free": "Outdoors & Free",
};
const CATEGORY_COLORS = {
  "CHECK - Category: Restaurants & Cafes": "#B84B5E",
  "CHECK - Category: Rooftops & Bars": "#E8A33D",
  "CHECK - Category: Culture & Museums": "#7D8FBF",
  "CHECK - Category: Activities & Experiences": "#6FA88C",
  "CHECK - Category: Outdoors & Free": "#9BB16C",
};
const PRICE_LABELS = {
  "CHECK - Price: Free": "Free",
  "CHECK - Price: Under Rs1,000": "Under ₹1,000",
  "CHECK - Price: Rs1,000-3,000": "₹1,000–3,000",
  "CHECK - Price: Rs3,000+": "₹3,000+",
};

let allRecords = [];
let activeCategory = "";
let activeNeighbourhood = "";
let activePrice = "";
let map, markersLayer;

function firstChecked(fields, map) {
  for (const key in map) if (fields[key]) return key;
  return null;
}

async function fetchAllRecords() {
  let records = [];
  let offset = null;
  do {
    let urlStr = `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${encodeURIComponent(AIRTABLE_TABLE_NAME)}?pageSize=100`;
    if (offset) urlStr += `&offset=${encodeURIComponent(offset)}`;
    const res = await fetch(urlStr, { headers: { Authorization: `Bearer ${AIRTABLE_PAT}` } });
    if (!res.ok) throw new Error(`Airtable fetch failed: ${res.status}`);
    const data = await res.json();
    records = records.concat(data.records);
    offset = data.offset;
  } while (offset);
  return records;
}

function isLive(fields) {
  return !!fields["CHECK - Live"] && !fields["CHECK - Flag: Do Not Publish (closed/bad fit)"];
}

function passesFilters(fields) {
  if (activeCategory && !fields[activeCategory]) return false;
  if (activePrice && !fields[activePrice]) return false;
  if (activeNeighbourhood && fields["Auto - Neighbourhood"] !== activeNeighbourhood) return false;
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  if (q) {
    const name = (fields["Auto - Name"] || "").toLowerCase();
    const hood = (fields["Auto - Neighbourhood"] || "").toLowerCase();
    if (!name.includes(q) && !hood.includes(q)) return false;
  }
  return true;
}

function renderGrid() {
  const grid = document.getElementById("grid");
  const visible = allRecords.filter(r => isLive(r.fields) && passesFilters(r.fields));
  if (visible.length === 0) {
    grid.innerHTML = `<div class="empty-state">No spots match those filters yet.</div>`;
    return;
  }
  grid.innerHTML = visible.map(r => {
    const f = r.fields;
    const catKey = firstChecked(f, CATEGORY_TAGS);
    const catLabel = catKey ? CATEGORY_TAGS[catKey] : "Uncategorized";
    const priceKey = firstChecked(f, PRICE_LABELS);
    const priceLabel = priceKey ? PRICE_LABELS[priceKey] : "";
    const photo = f["Auto - Photo URL 1"] || "";
    const verified = f["CHECK - Editor Verified"] ? `<div class="verified-dot">✦ Verified</div>` : "";
    const bg = photo ? `background-image:url('${photo}');` : "";
    const mapsUrl = f["Auto - Google Maps URL"] || "#";
    return `
      <a class="tile" style="${bg}" href="${mapsUrl}" target="_blank" rel="noopener">
        ${verified}
        <div class="tile-overlay">
          <span class="cat-tag">${catLabel}</span>
          <h3>${f["Auto - Name"] || "Untitled"}</h3>
          <div class="meta">${f["Auto - Neighbourhood"] || ""}${priceLabel ? " · " + priceLabel : ""}</div>
        </div>
      </a>`;
  }).join("");
}

function renderMap() {
  if (!map) {
    map = L.map("leafletMap").setView([19.0760, 72.8777], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      subdomains: 'abc',
      maxZoom: 19,
    }).addTo(map);
    markersLayer = L.layerGroup().addTo(map);
  }
  markersLayer.clearLayers();
  const visible = allRecords.filter(r => isLive(r.fields) && passesFilters(r.fields));
  visible.forEach(r => {
    const f = r.fields;
    const lat = parseFloat(f["Auto - Latitude"]);
    const lng = parseFloat(f["Auto - Longitude"]);
    if (isNaN(lat) || isNaN(lng)) return;
    const catKey = firstChecked(f, CATEGORY_TAGS);
    const color = catKey ? CATEGORY_COLORS[catKey] : "#F3ECE1";
    const marker = L.circleMarker([lat, lng], {
      radius: 7, color: color, fillColor: color, fillOpacity: 0.85, weight: 1,
    });
    const catLabel = catKey ? CATEGORY_TAGS[catKey] : "";
    marker.bindPopup(`
      <div class="popup-cat">${catLabel}</div>
      <div class="popup-name">${f["Auto - Name"] || ""}</div>
      <a class="popup-link" href="${f["Auto - Google Maps URL"] || "#"}" target="_blank" rel="noopener">Open in Google Maps ↗</a>
    `);
    marker.addTo(markersLayer);
  });
}

function populateNeighbourhoodFilter() {
  const select = document.getElementById("neighbourhoodFilter");
  const hoods = [...new Set(allRecords.map(r => r.fields["Auto - Neighbourhood"]).filter(Boolean))].sort();
  hoods.forEach(h => {
    const opt = document.createElement("option");
    opt.value = h; opt.textContent = h;
    select.appendChild(opt);
  });
}

function rerender() {
  renderGrid();
  if (document.getElementById("mapView").style.display !== "none") renderMap();
}

document.getElementById("searchInput").addEventListener("input", rerender);
document.getElementById("neighbourhoodFilter").addEventListener("change", e => { activeNeighbourhood = e.target.value; rerender(); });
document.getElementById("priceFilter").addEventListener("change", e => { activePrice = e.target.value; rerender(); });
document.querySelectorAll(".cat-pill").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".cat-pill").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeCategory = btn.dataset.cat;
    rerender();
  });
});
document.getElementById("btnGrid").addEventListener("click", () => {
  document.getElementById("btnGrid").classList.add("active");
  document.getElementById("btnMap").classList.remove("active");
  document.getElementById("gridView").style.display = "block";
  document.getElementById("mapView").style.display = "none";
});
document.getElementById("btnMap").addEventListener("click", () => {
  document.getElementById("btnMap").classList.add("active");
  document.getElementById("btnGrid").classList.remove("active");
  document.getElementById("gridView").style.display = "none";
  document.getElementById("mapView").style.display = "block";
  renderMap();
  setTimeout(() => map && map.invalidateSize(), 100);
});

(async function init() {
  try {
    allRecords = await fetchAllRecords();
    populateNeighbourhoodFilter();
    renderGrid();
  } catch (err) {
    document.getElementById("grid").innerHTML =
      `<div class="empty-state">Couldn't load spots. Check your Airtable Base ID, Table Name, and PAT in the config at the top of the script.<br><br>${err.message}</div>`;
    console.error(err);
  }
})();
</script>
</body>
</html>
